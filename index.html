<!doctype html>
<html lang="id" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ular Tangga Gotong Royong</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&amp;display=swap" rel="stylesheet">
  <style>
* { font-family: 'Nunito', sans-serif; }
html, body { height: 100%; margin: 0; }
@keyframes bounce-in { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-15deg); } 75% { transform: rotate(15deg); } }
@keyframes slide-up { from { transform: translateY(30px); opacity:0; } to { transform: translateY(0); opacity:1; } }
@keyframes confetti-fall { 0% { transform: translateY(-10px) rotate(0); opacity:1; } 100% { transform: translateY(60px) rotate(360deg); opacity:0; } }
@keyframes snake-eat { 0% { transform: scale(1); } 30% { transform: scale(0.5); } 60% { transform: scale(1.3); } 100% { transform: scale(1); } }
@keyframes ladder-climb { 0% { transform: translateY(0); } 50% { transform: translateY(-20px); } 100% { transform: translateY(0); } }

.cell { position: relative; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; transition: all 0.2s; cursor: default; }
.cell .cell-num { position: absolute; top: 2px; left: 4px; font-size: 9px; opacity: 0.7; font-weight: 700; }
.pion { position: absolute; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 900; border: 2px solid rgba(0,0,0,0.2); z-index: 10; transition: all 0.4s cubic-bezier(0.34,1.56,0.64,1); box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
.dice-btn { width: 80px; height: 80px; border-radius: 16px; font-size: 36px; font-weight: 900; border: none; cursor: pointer; transition: all 0.15s; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
.dice-rolling { animation: shake 0.15s infinite; }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 100; }
.modal-content { animation: slide-up 0.3s ease-out; }
.player-selector { cursor: pointer; transition: all 0.2s; border-radius: 12px; padding: 8px 12px; }
</style>
 </head>
 <body class="h-full overflow-auto" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);">
  <div id="app" class="h-full w-full flex flex-col items-center p-3 gap-3">
   <h1 id="game-title" class="text-xl md:text-2xl font-black text-white text-center drop-shadow-lg" style="text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">🤝 Ular Tangga Gotong Royong 🤝</h1>
   
   <div id="setup-screen" class="w-full max-w-md mx-auto bg-white/95 rounded-2xl p-6 shadow-2xl" style="animation: bounce-in 0.5s ease-out;">
    <h2 class="text-lg font-black text-center text-purple-700 mb-4">🎮 Pilih Pemain</h2>
    <div class="grid grid-cols-5 gap-2 mb-4">
     <div class="player-selector flex flex-col items-center gap-1 bg-red-100 border-2 border-red-300" onclick="togglePlayer(0)">
      <div class="w-8 h-8 rounded-full bg-red-500 flex items-center justify-center text-white font-black text-sm">⭐</div><span class="text-[10px] font-bold text-red-700">Merah</span>
     </div>
     <div class="player-selector flex flex-col items-center gap-1 bg-blue-100 border-2 border-blue-300" onclick="togglePlayer(1)">
      <div class="w-8 h-8 rounded-full bg-blue-500 flex items-center justify-center text-white font-black text-sm">💎</div><span class="text-[10px] font-bold text-blue-700">Biru</span>
     </div>
     <div class="player-selector flex flex-col items-center gap-1 bg-green-100 border-2 border-green-300" onclick="togglePlayer(2)">
      <div class="w-8 h-8 rounded-full bg-green-500 flex items-center justify-center text-white font-black text-sm">🌟</div><span class="text-[10px] font-bold text-green-700">Hijau</span>
     </div>
     <div class="player-selector flex flex-col items-center gap-1 bg-yellow-100 border-2 border-yellow-300" onclick="togglePlayer(3)">
      <div class="w-8 h-8 rounded-full bg-yellow-500 flex items-center justify-center text-white font-black text-sm">🔶</div><span class="text-[10px] font-bold text-yellow-700">Kuning</span>
     </div>
     <div class="player-selector flex flex-col items-center gap-1 bg-pink-100 border-2 border-pink-300" onclick="togglePlayer(4)">
      <div class="w-8 h-8 rounded-full bg-pink-500 flex items-center justify-center text-white font-black text-sm">💜</div><span class="text-[10px] font-bold text-pink-700">Pink</span>
     </div>
    </div>
    <p id="selected-count" class="text-center text-sm text-gray-500 mb-3">Pilih minimal 2 pemain</p>
    <button id="start-btn" onclick="startGame()" disabled class="w-full py-3 rounded-xl font-black text-white text-lg bg-gray-300 cursor-not-allowed transition-all">🎲 Mulai!</button>
   </div>

   <div id="game-screen" class="w-full hidden" style="max-width: 900px;">
    <div class="flex flex-col lg:flex-row gap-3 items-start">
     <div class="flex-1 w-full">
      <div id="board" class="grid gap-1 w-full" style="grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(5, 1fr);"></div>
     </div>
     <div class="w-full lg:w-56 flex flex-col gap-2">
      <div class="bg-white/95 rounded-xl p-3 text-center shadow-lg">
       <p class="text-xs font-bold text-gray-500">GILIRAN</p>
       <div id="current-player-display" class="text-lg font-black"></div>
      </div>
      <div class="bg-white/95 rounded-xl p-3 flex flex-col items-center gap-2 shadow-lg">
       <button id="dice-btn" onclick="rollDice()" class="dice-btn bg-gradient-to-br from-amber-400 to-orange-500 text-white">🎲</button>
       <div id="dice-result" class="text-sm font-bold text-gray-600"></div>
      </div>
      <div id="scores-panel" class="bg-white/95 rounded-xl p-3 shadow-lg">
       <p class="text-xs font-bold text-gray-500 mb-2">SKOR</p>
       <div id="scores-list" class="flex flex-col gap-1"></div>
      </div>
      <div id="info-box" class="bg-white/95 rounded-xl p-2 shadow-lg text-center">
       <p id="info-text" class="text-xs font-bold text-purple-600">Lempar dadu untuk mulai!</p>
      </div>
     </div>
    </div>
   </div>
  </div>

  <!-- Modals -->
  <div id="question-modal" class="modal-overlay hidden">
   <div class="modal-content bg-white rounded-2xl p-5 mx-3 shadow-2xl" style="max-width: 400px; width: 100%;">
    <p id="q-text" class="text-center font-bold text-gray-800 mb-4 text-sm leading-relaxed"></p>
    <div id="q-options" class="flex flex-col gap-2"></div>
   </div>
  </div>

  <div id="result-modal" class="modal-overlay hidden">
   <div class="modal-content bg-white rounded-2xl p-6 mx-3 shadow-2xl text-center" style="max-width: 380px; width: 100%;">
    <div id="result-icon" class="text-5xl mb-2"></div>
    <p id="result-text" class="font-black text-xl mb-1"></p>
    <p id="result-sub" class="text-sm text-gray-500 mb-4"></p>
    <button onclick="closeResult()" class="px-6 py-2 rounded-xl font-bold text-white bg-gradient-to-r from-purple-500 to-pink-500">Lanjut ▶</button>
   </div>
  </div>

  <div id="finish-modal" class="modal-overlay hidden">
   <div class="modal-content bg-white rounded-2xl p-6 mx-3 shadow-2xl text-center relative overflow-hidden" style="max-width: 420px; width: 100%;">
    <div id="confetti-container" class="absolute inset-0 pointer-events-none"></div>
    <div class="text-5xl mb-2">🏆</div>
    <h2 class="font-black text-2xl text-purple-700 mb-2">SELESAI!</h2>
    <div id="finish-scores" class="mb-4"></div>
    <button onclick="location.reload()" class="px-6 py-3 rounded-xl font-black text-white bg-gradient-to-r from-green-400 to-emerald-500 text-lg">🔄 Main Lagi</button>
   </div>
  </div>

<script>
// --- AUDIO SYSTEM ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx;
function getAudio() { if (!audioCtx) audioCtx = new AudioCtx(); return audioCtx; }
function playTone(freq, dur, type='square', vol=0.15) {
  try {
    const ctx = getAudio(); const o = ctx.createOscillator(); const g = ctx.createGain();
    o.type = type; o.frequency.value = freq; g.gain.value = vol;
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function sfxDice() { for(let i=0;i<6;i++) setTimeout(()=>playTone(200+i*50, 0.05, 'square', 0.1), i*40); }
function sfxMove() { playTone(500, 0.08, 'sine', 0.12); }
function sfxCorrect() { playTone(523, 0.15, 'sine', 0.15); setTimeout(()=>playTone(659, 0.15, 'sine', 0.15), 120); setTimeout(()=>playTone(784, 0.25, 'sine', 0.15), 240); }
function sfxWrong() { playTone(200, 0.3, 'sawtooth', 0.1); setTimeout(()=>playTone(150, 0.4, 'sawtooth', 0.1), 200); }

// --- GAME DATA ---
const ALL_QUESTIONS = [
  {q:"Membersihkan kelas bersama teman adalah contoh …", o:["kerja sama","bertengkar","bermain sendiri"], a:0},
  {q:"Menyapu rumah bersama keluarga termasuk …", o:["gotong royong","malas","diam saja"], a:0},
  {q:"Saat kerja kelompok, kita harus …", o:["bekerja sendiri","berbagi tugas","tidak ikut"], a:1},
  {q:"Membantu ibu mencuci piring adalah contoh …", o:["kerja sama","bermain","tidur"], a:0},
  {q:"Jika teman kesulitan, kita sebaiknya …", o:["menolong","mengejek","membiarkan"], a:0},
  {q:"Kerja sama membuat pekerjaan menjadi …", o:["lebih sulit","lebih cepat","lebih lama"], a:1},
  {q:"Membersihkan halaman sekolah bersama disebut …", o:["gotong royong","bermain","belajar sendiri"], a:0},
  {q:"Saat piket kelas, kita harus …", o:["bekerja sama","pulang","diam"], a:0}
];

const PLAYERS_DEF = [
  { name: 'Merah', color: '#ef4444', icon: '⭐', bg: '#fecaca' },
  { name: 'Biru', color: '#3b82f6', icon: '💎', bg: '#bfdbfe' },
  { name: 'Hijau', color: '#22c55e', icon: '🌟', bg: '#bbf7d0' },
  { name: 'Kuning', color: '#eab308', icon: '🔶', bg: '#fef08a' },
  { name: 'Pink', color: '#ec4899', icon: '💜', bg: '#fbcfe8' },
];

let selectedPlayers = new Set();
let players = [];
let currentPlayerIdx = 0;
let snakes = { 17: 4, 25: 10, 29: 15 };
let ladders = { 3: 14, 8: 20, 18: 26 };
let isAnimating = false;
let questionIdx = 0;

// --- LOGIC ---
function togglePlayer(idx) {
  const selectors = document.querySelectorAll('.player-selector');
  if (selectedPlayers.has(idx)) {
    selectedPlayers.delete(idx);
    selectors[idx].style.boxShadow = 'none';
  } else {
    selectedPlayers.add(idx);
    selectors[idx].style.boxShadow = `0 0 0 3px ${PLAYERS_DEF[idx].color}`;
  }
  const btn = document.getElementById('start-btn');
  btn.disabled = selectedPlayers.size < 2;
  btn.style.backgroundColor = selectedPlayers.size >= 2 ? '#8b5cf6' : '#d1d5db';
  btn.style.cursor = selectedPlayers.size >= 2 ? 'pointer' : 'not-allowed';
  document.getElementById('selected-count').textContent = `Pilih minimal 2 pemain (${selectedPlayers.size}/5)`;
}

function startGame() {
  players = Array.from(selectedPlayers).sort().map(idx => ({ ...PLAYERS_DEF[idx], pos: 1, score: 0 }));
  document.getElementById('setup-screen').classList.add('hidden');
  document.getElementById('game-screen').classList.remove('hidden');
  buildBoard();
  placePions();
  updateScores();
  updateCurrentPlayer();
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  const colors = ['#fef3c7','#dbeafe','#dcfce7','#fce7f3','#e0e7ff','#fef9c3'];
  for (let r = 4; r >= 0; r--) {
    for (let c = 0; c < 6; c++) {
      const col = (r % 2 === 0) ? c : 5 - c;
      const num = r * 6 + col + 1;
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.id = `cell-${num}`;
      cell.style.background = colors[num % 6];
      cell.style.aspectRatio = '1';
      cell.style.border = '1px solid rgba(0,0,0,0.1)';
      cell.innerHTML = `<span class="cell-num">${num}</span>`;
      if (snakes[num]) cell.innerHTML += '🐍';
      if (ladders[num]) cell.innerHTML += '🪜';
      board.appendChild(cell);
    }
  }
}

function placePions() {
  document.querySelectorAll('.pion').forEach(p => p.remove());
  players.forEach((p, i) => {
    const cellEl = document.getElementById(`cell-${p.pos}`);
    if (cellEl) {
      const pion = document.createElement('div');
      pion.className = 'pion';
      pion.style.background = p.color;
      pion.textContent = p.icon;
      const sameCell = players.filter((pp, ii) => ii < i && pp.pos === p.pos).length;
      pion.style.bottom = `${2 + sameCell * 6}px`;
      pion.style.right = `${2 + sameCell * 5}px`;
      cellEl.appendChild(pion);
    }
  });
}

async function rollDice() {
  if (isAnimating) return;
  isAnimating = true;
  const btn = document.getElementById('dice-btn');
  btn.classList.add('dice-rolling');
  sfxDice();
  
  const result = Math.floor(Math.random() * 6) + 1;
  setTimeout(() => {
    btn.classList.remove('dice-rolling');
    document.getElementById('dice-result').textContent = `Angka: ${result}`;
    movePlayer(result);
  }, 600);
}

async function movePlayer(steps) {
  const p = players[currentPlayerIdx];
  const target = Math.min(p.pos + steps, 30);
  
  for (let i = p.pos + 1; i <= target; i++) {
    p.pos = i;
    placePions();
    sfxMove();
    await new Promise(r => setTimeout(r, 250));
  }
  
  if (p.pos >= 30) { finishGame(); return; }
  
  if (snakes[p.pos]) {
    p.pos = snakes[p.pos];
    await new Promise(r => setTimeout(r, 400));
    placePions();
  } else if (ladders[p.pos]) {
    p.pos = ladders[p.pos];
    await new Promise(r => setTimeout(r, 400));
    placePions();
  }
  
  // Tampilkan soal otomatis
  setTimeout(showQuestion, 400);
}

function showQuestion() {
  const q = ALL_QUESTIONS[questionIdx % ALL_QUESTIONS.length];
  questionIdx++;
  document.getElementById('q-text').textContent = q.q;
  const opts = document.getElementById('q-options');
  opts.innerHTML = '';
  q.o.forEach((opt, i) => {
    const btn = document.createElement('button');
    btn.className = 'w-full py-2 px-4 rounded-xl font-bold bg-blue-50 hover:bg-blue-100 border-2 border-blue-200 text-sm';
    btn.textContent = opt;
    btn.onclick = () => answerQuestion(i, q.a);
    opts.appendChild(btn);
  });
  document.getElementById('question-modal').classList.remove('hidden');
}

function answerQuestion(chosen, correct) {
  document.getElementById('question-modal').classList.add('hidden');
  const p = players[currentPlayerIdx];
  if (chosen === correct) {
    p.score += 10; sfxCorrect();
    document.getElementById('result-icon').textContent = '🎉';
    document.getElementById('result-text').textContent = 'Benar! +10';
  } else {
    sfxWrong();
    document.getElementById('result-icon').textContent = '😢';
    document.getElementById('result-text').textContent = 'Salah!';
  }
  updateScores();
  document.getElementById('result-modal').classList.remove('hidden');
}

function closeResult() {
  document.getElementById('result-modal').classList.add('hidden');
  currentPlayerIdx = (currentPlayerIdx + 1) % players.length;
  updateCurrentPlayer();
  isAnimating = false;
}

function updateScores() {
  const list = document.getElementById('scores-list');
  list.innerHTML = '';
  players.forEach((p, i) => {
    const div = document.createElement('div');
    div.className = `flex justify-between p-2 rounded-lg ${i === currentPlayerIdx ? 'bg-white shadow' : ''}`;
    div.innerHTML = `<span style="color:${p.color}">${p.icon} ${p.name}</span><b>${p.score}</b>`;
    list.appendChild(div);
  });
}

function updateCurrentPlayer() {
  const p = players[currentPlayerIdx];
  document.getElementById('current-player-display').textContent = `${p.icon} ${p.name}`;
}

function finishGame() {
  document.getElementById('finish-modal').classList.remove('hidden');
}
</script>
 </body>
</html>
